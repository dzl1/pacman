<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Among Us - Imposter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #1a1a2e;
            color: white;
            overflow: hidden;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            pointer-events: auto;
        }

        #task-list {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            max-width: 250px;
            pointer-events: auto;
        }

        .task-item {
            margin: 5px 0;
            padding: 5px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
        }

        .task-item.completed {
            background: rgba(0, 255, 0, 0.3);
            text-decoration: line-through;
        }

        #chat {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 300px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            padding: 15px;
            pointer-events: auto;
        }

        #chat-messages {
            height: 150px;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        #chat-input {
            width: 100%;
            padding: 5px;
            border: none;
            border-radius: 5px;
        }

        #meeting-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .player-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            margin: 10px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .player-card:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .player-card.imposter {
            border: 2px solid red;
        }

        .player-card.dead {
            opacity: 0.5;
            filter: grayscale(100%);
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            z-index: 3000;
        }

        .btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            font-size: 16px;
        }

        .btn:hover {
            background: #45a049;
        }

        .btn.danger {
            background: #f44336;
        }

        .btn.danger:hover {
            background: #da190b;
        }

        #minimap {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: 200px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            pointer-events: auto;
        }

        .room {
            position: absolute;
            border: 1px solid #666;
            background: rgba(100, 100, 100, 0.3);
        }

        .player-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .player-dot.imposter {
            background: red;
            box-shadow: 0 0 5px red;
        }

        .player-dot.crew {
            background: cyan;
        }

        .player-dot.dead {
            background: gray;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui-overlay">
            <div id="hud">
                <div>Role: <span id="player-role">Crew</span></div>
                <div>Alive: <span id="alive-count">10</span></div>
                <div>Tasks: <span id="task-count">0/5</span></div>
            </div>

            <div id="task-list">
                <h3>Tasks</h3>
                <div id="tasks"></div>
            </div>

            <div id="chat">
                <div id="chat-messages"></div>
                <input type="text" id="chat-input" placeholder="Type message..." maxlength="100">
            </div>

            <div id="minimap">
                <!-- Minimap will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Game state
        const gameState = {
            phase: 'playing', // 'playing', 'meeting', 'gameOver'
            playerRole: 'crew',
            players: [],
            tasks: [],
            meetingsCalled: 0,
            gameTime: 0,
            lastKillTime: 0,
            lastMeetingTime: 0
        };

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.Fog(0x1a1a2e, 20, 100);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 0);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('game-container').appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 5);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        // Create space station layout
        const rooms = [
            { name: 'Cafeteria', x: 0, z: 0, width: 8, height: 6 },
            { name: 'Medbay', x: -12, z: 0, width: 6, height: 4 },
            { name: 'Security', x: 12, z: 0, width: 4, height: 4 },
            { name: 'Electrical', x: 0, z: -10, width: 6, height: 4 },
            { name: 'Navigation', x: 0, z: 10, width: 6, height: 4 },
            { name: 'Weapons', x: -10, z: -10, width: 4, height: 4 },
            { name: 'Shields', x: 10, z: -10, width: 4, height: 4 },
            { name: 'Communications', x: -10, z: 10, width: 4, height: 4 },
            { name: 'Storage', x: 10, z: 10, width: 4, height: 4 },
            { name: 'Admin', x: 0, z: 5, width: 4, height: 3 }
        ];

        // Create room geometries
        rooms.forEach(room => {
            const geometry = new THREE.BoxGeometry(room.width, 2, room.height);
            const material = new THREE.MeshLambertMaterial({
                color: room.name === 'Cafeteria' ? 0x4a90e2 : 0x666666,
                transparent: true,
                opacity: 0.7
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(room.x, 1, room.z);
            mesh.receiveShadow = true;
            scene.add(mesh);

            // Add room label
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 256;
            canvas.height = 64;
            context.font = '24px Arial';
            context.fillStyle = 'white';
            context.textAlign = 'center';
            context.fillText(room.name, 128, 40);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.position.set(room.x, 4, room.z);
            sprite.scale.set(3, 0.75, 1);
            scene.add(sprite);
        });

        // Create floor
        const floorGeometry = new THREE.PlaneGeometry(50, 50);
        const floorMaterial = new THREE.MeshLambertMaterial({ color: 0x333333 });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Create walls (corridors)
        const wallGeometry = new THREE.BoxGeometry(50, 3, 2);
        const wallMaterial = new THREE.MeshLambertMaterial({ color: 0x444444 });

        // Horizontal corridors
        const hWall1 = new THREE.Mesh(wallGeometry, wallMaterial);
        hWall1.position.set(0, 1.5, -4);
        scene.add(hWall1);

        const hWall2 = new THREE.Mesh(wallGeometry, wallMaterial);
        hWall2.position.set(0, 1.5, 4);
        scene.add(hWall2);

        // Vertical corridors
        const vWallGeometry = new THREE.BoxGeometry(2, 3, 50);
        const vWall1 = new THREE.Mesh(vWallGeometry, wallMaterial);
        vWall1.position.set(-4, 1.5, 0);
        scene.add(vWall1);

        const vWall2 = new THREE.Mesh(vWallGeometry, wallMaterial);
        vWall2.position.set(4, 1.5, 0);
        scene.add(vWall2);

        // Player class
        class Player {
            constructor(id, name, isImposter, x, z) {
                this.id = id;
                this.name = name;
                this.isImposter = isImposter;
                this.x = x;
                this.z = z;
                this.alive = true;
                this.color = isImposter ? 0xff0000 : Math.random() * 0xffffff;
                this.tasks = [];
                this.lastMessage = '';
                this.targetX = x;
                this.targetZ = z;
                this.speed = 0.1;

                // Create 3D representation
                const geometry = new THREE.CylinderGeometry(0.3, 0.3, 1.2, 8);
                const material = new THREE.MeshLambertMaterial({ color: this.color });
                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.position.set(x, 0.6, z);
                this.mesh.castShadow = true;
                scene.add(this.mesh);

                // Add name tag
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = 128;
                canvas.height = 32;
                context.font = '16px Arial';
                context.fillStyle = 'white';
                context.textAlign = 'center';
                context.fillText(name, 64, 20);

                const texture = new THREE.CanvasTexture(canvas);
                const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
                this.nameSprite = new THREE.Sprite(spriteMaterial);
                this.nameSprite.position.set(x, 1.5, z);
                this.nameSprite.scale.set(1.5, 0.4, 1);
                scene.add(this.nameSprite);
            }

            move(targetX, targetZ) {
                this.targetX = targetX;
                this.targetZ = targetZ;
            }

            update() {
                // Move towards target
                const dx = this.targetX - this.x;
                const dz = this.targetZ - this.z;
                const distance = Math.sqrt(dx * dx + dz * dz);

                if (distance > 0.1) {
                    this.x += (dx / distance) * this.speed;
                    this.z += (dz / distance) * this.speed;
                    this.mesh.position.set(this.x, 0.6, this.z);
                    this.nameSprite.position.set(this.x, 1.5, this.z);
                }
            }

            kill() {
                this.alive = false;
                this.mesh.material.color.setHex(0x666666);
                this.mesh.material.transparent = true;
                this.mesh.material.opacity = 0.5;
            }

            destroy() {
                scene.remove(this.mesh);
                scene.remove(this.nameSprite);
            }
        }

        // Initialize players
        const playerNames = ['Alice', 'Bob', 'Charlie', 'Diana', 'Eve', 'Frank', 'Grace', 'Henry', 'Ivy', 'Jack'];
        gameState.players = [];

        // Create player (you)
        const player = new Player(0, 'You', false, 0, 0);
        gameState.players.push(player);

        // Create AI players
        for (let i = 1; i < 10; i++) {
            const isImposter = i < 2; // 2 imposters
            const room = rooms[Math.floor(Math.random() * rooms.length)];
            const aiPlayer = new Player(i, playerNames[i], isImposter,
                room.x + (Math.random() - 0.5) * room.width * 0.8,
                room.z + (Math.random() - 0.5) * room.height * 0.8);
            gameState.players.push(aiPlayer);
        }

        // Set player role
        gameState.playerRole = player.isImposter ? 'Imposter' : 'Crew';
        document.getElementById('player-role').textContent = gameState.playerRole;

        // Create tasks for crew members
        gameState.tasks = [
            { id: 1, name: 'Fix Wiring', room: 'Electrical', completed: false },
            { id: 2, name: 'Scan ID', room: 'Admin', completed: false },
            { id: 3, name: 'Empty Trash', room: 'Cafeteria', completed: false },
            { id: 4, name: 'Calibrate Distributor', room: 'Storage', completed: false },
            { id: 5, name: 'Clean Filter', room: 'Medbay', completed: false }
        ];

        // Assign tasks to crew members
        gameState.players.forEach(p => {
            if (!p.isImposter) {
                p.tasks = gameState.tasks.slice();
            }
        });

        updateTaskList();

        // Input handling
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Mouse controls for movement
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        document.addEventListener('click', (event) => {
            if (gameState.phase !== 'playing' || !player.alive) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(floor);

            if (intersects.length > 0) {
                const point = intersects[0].point;
                player.move(point.x, point.z);
            }
        });

        // Chat system
        const chatInput = document.getElementById('chat-input');
        const chatMessages = document.getElementById('chat-messages');

        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const message = chatInput.value.trim();
                if (message) {
                    addChatMessage('You', message);
                    chatInput.value = '';

                    // AI responses
                    setTimeout(() => {
                        const responses = ['I saw someone suspicious!', 'I think I know who it is...', 'Let\'s check the cameras', 'I\'m doing my tasks'];
                        const randomResponse = responses[Math.floor(Math.random() * responses.length)];
                        const randomPlayer = gameState.players[Math.floor(Math.random() * gameState.players.length)];
                        if (randomPlayer.alive && randomPlayer !== player) {
                            addChatMessage(randomPlayer.name, randomResponse);
                        }
                    }, 1000 + Math.random() * 2000);
                }
            }
        });

        function addChatMessage(sender, message) {
            const messageEl = document.createElement('div');
            messageEl.textContent = `${sender}: ${message}`;
            chatMessages.appendChild(messageEl);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Emergency meeting
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' && gameState.phase === 'playing') {
                callMeeting('Emergency meeting called!');
            }
        });

        function callMeeting(reason) {
            gameState.phase = 'meeting';
            gameState.lastMeetingTime = gameState.gameTime;

            const overlay = document.createElement('div');
            overlay.id = 'meeting-overlay';
            overlay.innerHTML = `
                <h2>Emergency Meeting</h2>
                <p>${reason}</p>
                <div id="player-votes" style="display: flex; flex-wrap: wrap; justify-content: center;">
                    ${gameState.players.filter(p => p.alive).map(p => `
                        <div class="player-card" data-player-id="${p.id}">
                            <div style="font-size: 48px; margin-bottom: 10px;">${p.isImposter ? '👹' : '👤'}</div>
                            <div>${p.name}</div>
                            <div style="font-size: 12px; margin-top: 5px;">${p.isImposter ? 'Imposter' : 'Crew'}</div>
                        </div>
                    `).join('')}
                </div>
                <div style="margin-top: 20px;">
                    <button class="btn" id="skip-vote">Skip Vote</button>
                </div>
            `;

            document.body.appendChild(overlay);

            // Add vote handlers
            overlay.querySelectorAll('.player-card').forEach(card => {
                card.addEventListener('click', () => {
                    const playerId = parseInt(card.dataset.playerId);
                    const votedPlayer = gameState.players.find(p => p.id === playerId);

                    if (votedPlayer) {
                        votedPlayer.kill();
                        addChatMessage('System', `${votedPlayer.name} was ejected!`);
                        checkWinCondition();
                    }

                    overlay.remove();
                    gameState.phase = 'playing';
                });
            });

            overlay.querySelector('#skip-vote').addEventListener('click', () => {
                overlay.remove();
                gameState.phase = 'playing';
            });
        }

        function updateTaskList() {
            const taskList = document.getElementById('tasks');
            taskList.innerHTML = '';

            const playerTasks = player.tasks || [];
            playerTasks.forEach(task => {
                const taskEl = document.createElement('div');
                taskEl.className = `task-item ${task.completed ? 'completed' : ''}`;
                taskEl.textContent = task.name;
                taskList.appendChild(taskEl);
            });

            const completedTasks = playerTasks.filter(t => t.completed).length;
            document.getElementById('task-count').textContent = `${completedTasks}/${playerTasks.length}`;
        }

        function checkWinCondition() {
            const alivePlayers = gameState.players.filter(p => p.alive);
            const aliveCrew = alivePlayers.filter(p => !p.isImposter);
            const aliveImposters = alivePlayers.filter(p => p.isImposter);

            if (aliveImposters.length === 0) {
                endGame('Crew Victory!', 'All imposters have been eliminated!');
            } else if (aliveImposters.length >= aliveCrew.length) {
                endGame('Imposter Victory!', 'Imposters have taken over the station!');
            }
        }

        function endGame(title, message) {
            gameState.phase = 'gameOver';

            const overlay = document.createElement('div');
            overlay.id = 'game-over';
            overlay.innerHTML = `
                <h2>${title}</h2>
                <p>${message}</p>
                <button class="btn" onclick="location.reload()">Play Again</button>
            `;

            document.body.appendChild(overlay);
        }

        // Update minimap
        function updateMinimap() {
            const minimap = document.getElementById('minimap');
            minimap.innerHTML = '<div style="padding: 10px; color: white; font-size: 12px;">Minimap</div>';

            // Scale factor for minimap
            const scale = 200 / 50; // minimap size / world size

            rooms.forEach(room => {
                const roomEl = document.createElement('div');
                roomEl.className = 'room';
                roomEl.style.left = `${(room.x + 25) * scale - room.width * scale / 2}px`;
                roomEl.style.top = `${(room.z + 25) * scale - room.height * scale / 2}px`;
                roomEl.style.width = `${room.width * scale}px`;
                roomEl.style.height = `${room.height * scale}px`;
                minimap.appendChild(roomEl);
            });

            gameState.players.forEach(p => {
                const dot = document.createElement('div');
                dot.className = `player-dot ${p.isImposter ? 'imposter' : 'crew'} ${p.alive ? '' : 'dead'}`;
                dot.style.left = `${(p.x + 25) * scale}px`;
                dot.style.top = `${(p.z + 25) * scale}px`;
                minimap.appendChild(dot);
            });
        }

        // Game loop
        let lastTime = 0;
        function animate(currentTime) {
            requestAnimationFrame(animate);

            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;
            gameState.gameTime += deltaTime;

            if (gameState.phase === 'playing') {
                // Update players
                gameState.players.forEach(p => {
                    if (p.alive) {
                        p.update();

                        // AI movement
                        if (p !== player && Math.random() < 0.005) {
                            const room = rooms[Math.floor(Math.random() * rooms.length)];
                            p.move(
                                room.x + (Math.random() - 0.5) * room.width * 0.8,
                                room.z + (Math.random() - 0.5) * room.height * 0.8
                            );
                        }

                        // Task completion
                        if (!p.isImposter && p.tasks && p.tasks.length > 0) {
                            const currentRoom = rooms.find(r =>
                                Math.abs(p.x - r.x) < r.width / 2 &&
                                Math.abs(p.z - r.z) < r.height / 2
                            );

                            if (currentRoom) {
                                const availableTasks = p.tasks.filter(t => !t.completed && t.room === currentRoom.name);
                                if (availableTasks.length > 0 && Math.random() < 0.01) {
                                    availableTasks[0].completed = true;
                                    if (p === player) {
                                        updateTaskList();
                                        addChatMessage('System', `Task completed: ${availableTasks[0].name}`);
                                    }
                                }
                            }
                        }
                    }
                });

                // Imposter kill cooldown
                if (player.isImposter && gameState.gameTime - gameState.lastKillTime > 15000) { // 15 second cooldown
                    // Check for nearby crew to kill
                    gameState.players.forEach(p => {
                        if (!p.isImposter && p.alive && p !== player) {
                            const distance = Math.sqrt((p.x - player.x) ** 2 + (p.z - player.z) ** 2);
                            if (distance < 2 && Math.random() < 0.01) {
                                p.kill();
                                gameState.lastKillTime = gameState.gameTime;
                                addChatMessage('System', `${p.name} was found dead!`);
                                checkWinCondition();
                            }
                        }
                    });
                }

                updateMinimap();
            }

            // Update alive count
            const aliveCount = gameState.players.filter(p => p.alive).length;
            document.getElementById('alive-count').textContent = aliveCount;

            renderer.render(scene, camera);
        }

        animate(0);

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initial chat messages
        addChatMessage('System', 'Welcome to Among Us! Click to move, SPACE for emergency meeting.');
        addChatMessage('System', `You are ${gameState.playerRole}.`);
    </script>
</body>
</html>
