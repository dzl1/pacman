<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Station Imposter - 3D Exploration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            color: white;
            overflow: hidden;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .ui-panel {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            padding: 15px;
            backdrop-filter: blur(5px);
            pointer-events: auto;
        }

        .top-panel {
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-info {
            display: flex;
            gap: 20px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .minimap {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 200px;
            height: 200px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            border: 2px solid #333;
            pointer-events: auto;
        }

        .minimap canvas {
            width: 100%;
            height: 100%;
            border-radius: 8px;
        }

        .bottom-panel {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }

        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            pointer-events: auto;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn.danger {
            background: linear-gradient(45deg, #f44336, #e53935);
        }

        .btn.secondary {
            background: linear-gradient(45deg, #4CAF50, #45a049);
        }

        .task-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 300px;
            max-height: 400px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            padding: 15px;
            pointer-events: auto;
            overflow-y: auto;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
        }

        .task-item.completed {
            background: rgba(76, 175, 80, 0.2);
            text-decoration: line-through;
        }

        .task-icon {
            font-size: 1.2em;
        }

        .task-name {
            flex: 1;
        }

        .task-location {
            font-size: 0.8em;
            color: #ccc;
        }

        .notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(76, 175, 80, 0.9);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            z-index: 1000;
            animation: fadeIn 0.5s ease;
            pointer-events: auto;
        }

        .notification.error {
            background: rgba(244, 67, 54, 0.9);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            pointer-events: auto;
        }

        .game-over h2 {
            font-size: 3em;
            margin-bottom: 20px;
            color: #667eea;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            padding: 15px;
            pointer-events: auto;
        }

        .controls h3 {
            margin-bottom: 10px;
            color: #667eea;
        }

        .controls ul {
            list-style: none;
            padding: 0;
        }

        .controls li {
            margin-bottom: 5px;
            font-size: 0.9em;
            color: #ccc;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1000;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #333;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .task-panel {
                width: 250px;
                max-height: 300px;
            }

            .minimap {
                width: 150px;
                height: 150px;
            }

            .top-panel {
                flex-direction: column;
                gap: 10px;
            }

            .bottom-panel {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui-overlay">
            <div class="ui-panel top-panel">
                <div class="game-info">
                    <div class="info-item">
                        <span>🚀</span>
                        <span>Space Station Alpha</span>
                    </div>
                    <div class="info-item">
                        <span>👥</span>
                        <span id="alive-count">10</span>
                    </div>
                    <div class="info-item">
                        <span>📋</span>
                        <span id="tasks-completed">0/8</span>
                    </div>
                    <div class="info-item">
                        <span>⚠️</span>
                        <span id="alert-status">Normal</span>
                    </div>
                </div>
            </div>

            <div class="minimap ui-panel">
                <canvas id="minimap-canvas"></canvas>
            </div>

            <div class="task-panel ui-panel">
                <h3>📋 Tasks</h3>
                <div id="task-list">
                    <!-- Tasks will be populated by JavaScript -->
                </div>
            </div>

            <div class="bottom-panel ui-panel">
                <button class="btn secondary" id="report-btn">Report Body</button>
                <button class="btn" id="call-meeting-btn">Emergency Meeting</button>
                <button class="btn danger" id="kill-btn">Kill</button>
            </div>

            <div class="controls ui-panel">
                <h3>🎮 Controls</h3>
                <ul>
                    <li><strong>WASD</strong> - Move</li>
                    <li><strong>Mouse</strong> - Look around</li>
                    <li><strong>E</strong> - Interact</li>
                    <li><strong>Space</strong> - Jump</li>
                    <li><strong>Shift</strong> - Sprint</li>
                </ul>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <script>
        // Game state
        let gameState = {
            player: {
                position: { x: 0, y: 0, z: 0 },
                isImposter: false,
                tasks: [],
                alive: true
            },
            players: [],
            tasks: [],
            bodies: [],
            phase: 'playing', // 'playing', 'meeting', 'game-over'
            alertLevel: 'normal' // 'normal', 'suspicious', 'emergency'
        };

        // Three.js variables
        let scene, camera, renderer, controls;
        let minimapCanvas, minimapCtx;
        let keys = {};
        let moveSpeed = 0.1;
        let sprintMultiplier = 2;
        let canJump = false;
        let velocity = { x: 0, y: 0, z: 0 };
        let gravity = -0.01;
        let floorY = -2;

        // Station layout
        const stationRooms = {
            bridge: { x: 0, z: 0, size: 10 },
            engine: { x: 15, z: 0, size: 8 },
            medbay: { x: -15, z: 0, size: 6 },
            cafeteria: { x: 0, z: 15, size: 12 },
            security: { x: 0, z: -15, size: 8 },
            electrical: { x: 20, z: 10, size: 6 },
            storage: { x: -20, z: -10, size: 8 },
            reactor: { x: 25, z: -15, size: 10 }
        };

        // Initialize Three.js scene
        function initThreeJS() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000011);
            scene.fog = new THREE.Fog(0x000011, 10, 50);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 5);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('game-container').appendChild(renderer.domElement);

            // Controls
            controls = new THREE.PointerLockControls(camera, document.body);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 10, 5);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);

            // Create station
            createStation();

            // Create player representation
            createPlayer();

            // Initialize minimap
            initMinimap();

            // Event listeners
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('click', onMouseClick);
            window.addEventListener('resize', onWindowResize);

            // Start game loop
            animate();
        }

        function createStation() {
            // Floor
            const floorGeometry = new THREE.PlaneGeometry(100, 100);
            const floorMaterial = new THREE.MeshLambertMaterial({ color: 0x333333 });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Walls and rooms
            Object.entries(stationRooms).forEach(([roomName, room]) => {
                createRoom(roomName, room);
            });

            // Corridors
            createCorridors();
        }

        function createRoom(name, room) {
            // Room floor
            const roomFloorGeometry = new THREE.PlaneGeometry(room.size, room.size);
            const roomFloorMaterial = new THREE.MeshLambertMaterial({ color: 0x444444 });
            const roomFloor = new THREE.Mesh(roomFloorGeometry, roomFloorMaterial);
            roomFloor.position.set(room.x, -1.9, room.z);
            roomFloor.rotation.x = -Math.PI / 2;
            scene.add(roomFloor);

            // Walls
            const wallHeight = 4;
            const wallThickness = 0.2;

            // North wall
            const northWall = new THREE.Mesh(
                new THREE.BoxGeometry(room.size, wallHeight, wallThickness),
                new THREE.MeshLambertMaterial({ color: 0x666666 })
            );
            northWall.position.set(room.x, wallHeight/2 - 2, room.z - room.size/2);
            scene.add(northWall);

            // South wall
            const southWall = new THREE.Mesh(
                new THREE.BoxGeometry(room.size, wallHeight, wallThickness),
                new THREE.MeshLambertMaterial({ color: 0x666666 })
            );
            southWall.position.set(room.x, wallHeight/2 - 2, room.z + room.size/2);
            scene.add(southWall);

            // East wall
            const eastWall = new THREE.Mesh(
                new THREE.BoxGeometry(wallThickness, wallHeight, room.size),
                new THREE.MeshLambertMaterial({ color: 0x666666 })
            );
            eastWall.position.set(room.x + room.size/2, wallHeight/2 - 2, room.z);
            scene.add(eastWall);

            // West wall
            const westWall = new THREE.Mesh(
                new THREE.BoxGeometry(wallThickness, wallHeight, room.size),
                new THREE.MeshLambertMaterial({ color: 0x666666 })
            );
            westWall.position.set(room.x - room.size/2, wallHeight/2 - 2, room.z);
            scene.add(westWall);

            // Room label
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 256;
            canvas.height = 64;
            context.font = 'Bold 24px Arial';
            context.fillStyle = 'white';
            context.fillText(name.toUpperCase(), 10, 40);

            const texture = new THREE.CanvasTexture(canvas);
            const labelMaterial = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
            const labelGeometry = new THREE.PlaneGeometry(4, 1);
            const label = new THREE.Mesh(labelGeometry, labelMaterial);
            label.position.set(room.x, 1, room.z - room.size/2 + 0.1);
            scene.add(label);
        }

        function createCorridors() {
            // Main corridors
            const corridorWidth = 3;
            const corridorMaterial = new THREE.MeshLambertMaterial({ color: 0x222222 });

            // Horizontal corridors
            const horizCorridor1 = new THREE.Mesh(
                new THREE.PlaneGeometry(50, corridorWidth),
                corridorMaterial
            );
            horizCorridor1.position.set(0, -1.9, 0);
            horizCorridor1.rotation.x = -Math.PI / 2;
            scene.add(horizCorridor1);

            // Vertical corridors
            const vertCorridor1 = new THREE.Mesh(
                new THREE.PlaneGeometry(corridorWidth, 50),
                corridorMaterial
            );
            vertCorridor1.position.set(0, -1.9, 0);
            vertCorridor1.rotation.x = -Math.PI / 2;
            scene.add(vertCorridor1);
        }

        function createPlayer() {
            // Simple player representation (you can see yourself)
            const geometry = new THREE.CylinderGeometry(0.5, 0.5, 2);
            const material = new THREE.MeshLambertMaterial({ color: 0x00ff00 });
            const playerMesh = new THREE.Mesh(geometry, material);
            playerMesh.position.set(0, 0, 0);
            playerMesh.castShadow = true;
            scene.add(playerMesh);

            // Store reference
            gameState.player.mesh = playerMesh;
        }

        function initMinimap() {
            minimapCanvas = document.getElementById('minimap-canvas');
            minimapCtx = minimapCanvas.getContext('2d');
            minimapCanvas.width = 200;
            minimapCanvas.height = 200;
        }

        function updateMinimap() {
            minimapCtx.fillStyle = '#000011';
            minimapCtx.fillRect(0, 0, 200, 200);

            // Draw rooms
            minimapCtx.strokeStyle = '#666';
            minimapCtx.lineWidth = 2;

            Object.entries(stationRooms).forEach(([name, room]) => {
                const scale = 3;
                const x = 100 + room.x * scale;
                const z = 100 + room.z * scale;
                const size = room.size * scale;

                minimapCtx.strokeRect(x - size/2, z - size/2, size, size);

                // Room name
                minimapCtx.fillStyle = '#fff';
                minimapCtx.font = '8px Arial';
                minimapCtx.fillText(name, x - size/2 + 2, z - size/2 + 10);
            });

            // Draw player
            const playerX = 100 + camera.position.x * 3;
            const playerZ = 100 + camera.position.z * 3;
            minimapCtx.fillStyle = '#00ff00';
            minimapCtx.beginPath();
            minimapCtx.arc(playerX, playerZ, 3, 0, Math.PI * 2);
            minimapCtx.fill();

            // Draw other players
            gameState.players.forEach(player => {
                if (player.alive) {
                    const px = 100 + player.position.x * 3;
                    const pz = 100 + player.position.z * 3;
                    minimapCtx.fillStyle = player.isImposter ? '#ff0000' : '#0088ff';
                    minimapCtx.beginPath();
                    minimapCtx.arc(px, pz, 2, 0, Math.PI * 2);
                    minimapCtx.fill();
                }
            });
        }

        // Initialize tasks
        function initTasks() {
            const taskTypes = [
                { name: 'Fix Wiring', location: 'Electrical', icon: '🔌' },
                { name: 'Empty Trash', location: 'Storage', icon: '🗑️' },
                { name: 'Calibrate Distributor', location: 'Reactor', icon: '⚙️' },
                { name: 'Clean O2 Filter', location: 'Medbay', icon: '💨' },
                { name: 'Download Data', location: 'Bridge', icon: '💾' },
                { name: 'Align Telescope', location: 'Bridge', icon: '🔭' },
                { name: 'Inspect Samples', location: 'Medbay', icon: '🧪' },
                { name: 'Fuel Engines', location: 'Engine', icon: '⛽' }
            ];

            gameState.tasks = taskTypes.map((task, index) => ({
                id: index,
                ...task,
                completed: false,
                position: getRoomCenter(task.location)
            }));

            renderTaskList();
        }

        function getRoomCenter(roomName) {
            const room = stationRooms[roomName.toLowerCase()];
            return { x: room.x, y: 0, z: room.z };
        }

        function renderTaskList() {
            const taskList = document.getElementById('task-list');
            taskList.innerHTML = '';

            gameState.tasks.forEach(task => {
                const taskItem = document.createElement('div');
                taskItem.className = `task-item ${task.completed ? 'completed' : ''}`;

                taskItem.innerHTML = `
                    <span class="task-icon">${task.icon}</span>
                    <span class="task-name">${task.name}</span>
                    <span class="task-location">${task.location}</span>
                `;

                taskList.appendChild(taskItem);
            });

            updateTaskCounter();
        }

        function updateTaskCounter() {
            const completed = gameState.tasks.filter(t => t.completed).length;
            document.getElementById('tasks-completed').textContent = `${completed}/${gameState.tasks.length}`;
        }

        // Movement and controls
        function onKeyDown(event) {
            keys[event.code] = true;

            if (event.code === 'KeyE') {
                interact();
            }
        }

        function onKeyUp(event) {
            keys[event.code] = false;
        }

        function onMouseClick() {
            if (!controls.isLocked) {
                controls.lock();
            }
        }

        function updateMovement() {
            if (!controls.isLocked) return;

            const direction = new THREE.Vector3();
            camera.getWorldDirection(direction);
            direction.y = 0;
            direction.normalize();

            const right = new THREE.Vector3();
            right.crossVectors(camera.up, direction).normalize();

            let speed = moveSpeed;
            if (keys['ShiftLeft'] || keys['ShiftRight']) {
                speed *= sprintMultiplier;
            }

            if (keys['KeyW']) {
                camera.position.addScaledVector(direction, speed);
            }
            if (keys['KeyS']) {
                camera.position.addScaledVector(direction, -speed);
            }
            if (keys['KeyA']) {
                camera.position.addScaledVector(right, speed);
            }
            if (keys['KeyD']) {
                camera.position.addScaledVector(right, -speed);
            }

            // Simple collision detection with walls
            camera.position.x = Math.max(-40, Math.min(40, camera.position.x));
            camera.position.z = Math.max(-40, Math.min(40, camera.position.z));

            // Update player mesh position
            if (gameState.player.mesh) {
                gameState.player.mesh.position.copy(camera.position);
                gameState.player.mesh.position.y = -2;
            }

            gameState.player.position = camera.position;
        }

        function interact() {
            // Check for nearby tasks
            gameState.tasks.forEach(task => {
                if (!task.completed) {
                    const distance = camera.position.distanceTo(new THREE.Vector3(task.position.x, task.position.y, task.position.z));
                    if (distance < 3) {
                        completeTask(task);
                    }
                }
            });

            // Check for bodies to report
            gameState.bodies.forEach((body, index) => {
                const distance = camera.position.distanceTo(new THREE.Vector3(body.x, body.y, body.z));
                if (distance < 2) {
                    reportBody(index);
                }
            });
        }

        function completeTask(task) {
            task.completed = true;
            renderTaskList();
            showNotification(`Task completed: ${task.name}!`);

            // Check win condition
            const allTasksCompleted = gameState.tasks.every(t => t.completed);
            if (allTasksCompleted) {
                endGame('Crew Victory!', 'All tasks completed!');
            }
        }

        function reportBody(bodyIndex) {
            const body = gameState.bodies[bodyIndex];
            gameState.bodies.splice(bodyIndex, 1);

            // Remove body from scene
            scene.remove(body.mesh);

            showNotification('Body reported! Emergency meeting called.');
            startMeeting();
        }

        function startMeeting() {
            gameState.phase = 'meeting';
            showNotification('Emergency Meeting! Discuss and vote.');
            // In a full implementation, this would pause movement and show voting UI
        }

        function killPlayer() {
            if (!gameState.player.isImposter) return;

            // Find nearest player
            let nearestPlayer = null;
            let nearestDistance = Infinity;

            gameState.players.forEach(player => {
                if (player.alive && player !== gameState.player) {
                    const distance = camera.position.distanceTo(new THREE.Vector3(player.position.x, player.position.y, player.position.z));
                    if (distance < nearestDistance && distance < 5) {
                        nearestDistance = distance;
                        nearestPlayer = player;
                    }
                }
            });

            if (nearestPlayer) {
                nearestPlayer.alive = false;
                showNotification(`${nearestPlayer.name} has been eliminated!`);

                // Create body
                const bodyGeometry = new THREE.CylinderGeometry(0.5, 0.5, 0.1);
                const bodyMaterial = new THREE.MeshLambertMaterial({ color: 0xff0000 });
                const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
                body.position.set(nearestPlayer.position.x, -1.95, nearestPlayer.position.z);
                scene.add(body);

                gameState.bodies.push({
                    x: nearestPlayer.position.x,
                    y: -1.95,
                    z: nearestPlayer.position.z,
                    mesh: body
                });

                updateAliveCount();
                checkWinCondition();
            } else {
                showNotification('No players nearby to kill!', 'error');
            }
        }

        function updateAliveCount() {
            const aliveCount = gameState.players.filter(p => p.alive).length + (gameState.player.alive ? 1 : 0);
            document.getElementById('alive-count').textContent = aliveCount;
        }

        function checkWinCondition() {
            const alivePlayers = gameState.players.filter(p => p.alive);
            const aliveCrew = alivePlayers.filter(p => !p.isImposter);
            const aliveImposters = alivePlayers.filter(p => p.isImposter);

            if (aliveImposters.length === 0) {
                endGame('Crew Victory!', 'All imposters have been eliminated!');
            } else if (aliveImposters.length >= aliveCrew.length) {
                endGame('Imposter Victory!', 'Imposters have taken over!');
            }
        }

        function endGame(title, message) {
            gameState.phase = 'game-over';

            const overlay = document.createElement('div');
            overlay.className = 'game-over';
            overlay.innerHTML = `
                <h2>${title}</h2>
                <p>${message}</p>
                <button class="btn" onclick="location.reload()">Play Again</button>
            `;

            document.body.appendChild(overlay);
        }

        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.getElementById('ui-overlay').appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            updateMovement();
            updateMinimap();

            renderer.render(scene, camera);
        }

        // Initialize other players
        function initPlayers() {
            const names = ['Alice', 'Bob', 'Charlie', 'Diana', 'Eve', 'Frank', 'Grace', 'Henry', 'Ivy'];
            const imposters = ['Bob', 'Eve']; // 2 imposters

            names.forEach((name, index) => {
                const isImposter = imposters.includes(name);
                const player = {
                    id: index,
                    name: name,
                    isImposter: isImposter,
                    alive: true,
                    position: {
                        x: (Math.random() - 0.5) * 20,
                        y: 0,
                        z: (Math.random() - 0.5) * 20
                    }
                };

                gameState.players.push(player);

                // Create player mesh
                const geometry = new THREE.CylinderGeometry(0.5, 0.5, 2);
                const material = new THREE.MeshLambertMaterial({ color: isImposter ? 0xff0000 : 0x0088ff });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(player.position.x, player.position.y, player.position.z);
                mesh.castShadow = true;
                scene.add(mesh);

                player.mesh = mesh;
            });

            // Randomly assign imposter role to player
            gameState.player.isImposter = Math.random() < 0.2;
        }

        // Event listeners for buttons
        document.getElementById('report-btn').addEventListener('click', () => {
            if (gameState.bodies.length > 0) {
                reportBody(0);
            } else {
                showNotification('No bodies to report!', 'error');
            }
        });

        document.getElementById('call-meeting-btn').addEventListener('click', () => {
            startMeeting();
        });

        document.getElementById('kill-btn').addEventListener('click', () => {
            if (gameState.player.isImposter) {
                killPlayer();
            } else {
                showNotification('You are not an imposter!', 'error');
            }
        });

        // Initialize game
        function initGame() {
            initThreeJS();
            initTasks();
            initPlayers();
            updateAliveCount();

            // Show loading screen briefly
            const loading = document.createElement('div');
            loading.className = 'loading';
            loading.innerHTML = `
                <div class="loading-spinner"></div>
                <p>Loading Space Station...</p>
            `;
            document.body.appendChild(loading);

            setTimeout(() => {
                loading.remove();
            }, 2000);
        }

        initGame();
    </script>
</body>
</html>
